<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Papa!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #1e3a8a, #3b82f6, #6d28d9, #7c3aed);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .main-card {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 25px;
            }
            .image-side { order: -1; }
        }

        .intro {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #bae6fd;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #facc15;
            text-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .typewriter-box {
            height: 35px;
            margin-bottom: 30px;
        }

        .typewriter-text {
            font-size: 1.8rem;
            font-weight: 400;
            border-right: 3px solid white;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            display: inline-block;
            animation: typing 4s steps(14, end) infinite, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            40%, 80% { width: 14ch; }
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        .btn-link {
            background: #ffffff;
            color: #1e40af;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: #facc15;
            color: #1e3a8a;
            transform: translateY(-2px);
        }

        .dad-photo {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        /* --- Mechanical Pop-up Overlay --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Pure CSS Rule: Displays immediately when URL ends with #msgDashboard */
        #msgDashboard:target {
            display: flex !important;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e40af, #4f46e5);
            border-radius: 24px;
            padding: 30px;
            max-width: 950px;
            width: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 800px) {
            .modal-content {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            text-decoration: none;
            z-index: 1010;
        }

        .nav-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 5px;
        }

        .member-link {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .member-link:hover {
            background: #facc15;
            color: #1e3a8a;
            border-color: #facc15;
        }

        .display-side {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        /* --- Mechanical Card Switching Logic --- */
        .pane {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 15px;
        }

        /* Show the active greeting frame mechanically based on URL anchor targets */
        #msgDashboard:target #p-default { display: flex; }
        #view-mamaw:target #p-mamaw { display: flex !important; }
        #view-brylle:target #p-brylle { display: flex !important; }
        #view-kuya:target #p-kuya { display: flex !important; }

        /* Hide the default view whenever a specific profile link target becomes active */
        #view-mamaw:target #p-default,
        #view-brylle:target #p-default,
        #view-kuya:target #p-default { display: none !important; }

        /* Style active target links to turn bright gold mechanically */
        #view-mamaw:target #lnk-mamaw,
        #view-brylle:target #lnk-brylle,
        #view-kuya:target #lnk-kuya {
            background: #facc15 !important;
            color: #1e3a8a !important;
            border-color: #facc15 !important;
        }

        .pane img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .msg-box {
            font-size: 1.05rem;
            line-height: 1.5;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #facc15;
            font-style: italic;
            max-height: 180px;
            overflow-y: auto;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -10px;
            z-index: 2000;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-side">
            <p class="intro">Happy Birthday!</p>
            <h1>Best Papa!</h1>
            <div class="typewriter-box">
                <span class="typewriter-text">Jerome Abillon</span>
            </div>
            <!-- Opens the popup framework directly through HTML target anchors -->
            <a href="#msgDashboard" class="btn-link" onclick="triggerConfetti()">Messages ❤️</a>
        </div>
        <div class="image-side">
            <img src="papa%202nd.jpg" class="dad-photo" alt="Papa">
        </div>
    </div>

    <!-- Messages Modal Popup Box Layout Container -->
    <!-- Responds directly to target URLs #msgDashboard, #view-mamaw, #view-brylle, and #view-kuya -->
    <div class="modal" id="msgDashboard">
        <div class="modal-content" id="view-mamaw">
        <div class="modal-content" id="view-brylle">
        <div class="modal-content" id="view-kuya">
            <!-- Clear link hash to mechanically close the card frame -->
            <a href="#" class="close-btn">&times;</a>
            
            <div class="nav-side">
                <div class="nav-title">Family Messages</div>
                <a href="#view-mamaw" class="member-link" id="lnk-mamaw" onclick="triggerConfetti()">Mamaw</a>
                <a href="#view-brylle" class="member-link" id="lnk-brylle" onclick="triggerConfetti()">Brylle</a>
                <a href="#view-kuya" class="member-link" id="lnk-kuya" onclick="triggerConfetti()">Kuya</a>
            </div>
            
            <div class="display-side">
                <div class="pane" id="p-default">
