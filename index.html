<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Papa! | Papaw's Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #1e3a8a, #3b82f6, #6d28d9, #7c3aed);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 20px;
            }
            .image-side {
                order: -1;
            }
        }

        .text-side p.intro {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .text-side h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.1;
            color: #facc15 !important; 
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.6) !important;
        }

        .text-side h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 25px;
            border-right: 3px solid white;
            white-space: nowrap;
            width: 0;
            overflow: hidden;
            animation: typing 4s steps(14, end) infinite, blink 0.75s step-end infinite;
        }

        @media (max-width: 900px) {
            .text-side h1 { font-size: 2.8rem; }
            .text-side h2 { font-size: 1.4rem; margin: 0 auto 25px auto; }
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            40%, 80% { width: 14ch; }
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .cta-buttons { justify-content: center; }
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: white;
        }

        .btn-filled {
            background-color: white;
            color: #2563eb;
        }

        .btn-filled:hover {
            background-color: transparent;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: #2563eb;
        }

        .cake-area {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        @media (max-width: 900px) {
            .cake-area { align-items: center; margin-bottom: 30px; }
        }

        .cake-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 45px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none; 
            user-select: none;
            z-index: 5;
        }

        .cake {
            position: relative;
            width: 180px;
            height: 90px;
            background: #f472b6;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 15px #f43f5e, 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 50 !important; 
        }
        
        .cake:hover {
            transform: scale(1.03);
        }

        .cake::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 14px;
            background: #fff;
            top: 40px;
            left: 0;
        }

        .cake::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 12px;
            background: #f43f5e;
            top: 15px;
            left: 0;
            border-radius: 0 0 10px 10px;
        }

        .candle {
            position: absolute;
            width: 12px;
            height: 35px;
            background: linear-gradient(to right, #6ee7b7, #34d399);
            top: -35px;
            left: 84px;
            border-radius: 3px 3px 0 0;
            pointer-events: none;
        }

        .flame {
            position: absolute;
            width: 14px;
            height: 22px;
            background: #fb923c;
            border-radius: 50% 50% 20% 20%;
            top: -24px;
            left: -1px;
            box-shadow: 0 0 15px #f97316;
            animation: flicker 0.6s infinite alternate;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); background: #f97316; }
            100% { transform: scale(1.1) rotate(2deg); background: #fbbf24; }
        }

        .cake.blown .flame {
            opacity: 0;
        }

        .image-side {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .dad-photo-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .dad-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 100;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }

        .bg-spark {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatUp linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 20; i++) {
            const spark = document.createElement('div');
            spark.classList.add('bg-spark');
            spark.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 5 + 3 + 'px';
            spark.style.width = size;
            spark.style.height = size;
            spark.style.animationDuration = Math.random() * 6 + 6 + 's';
            spark.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(spark);
        }
    </script>

    <header>
        <div class="logo">Papaw's day</div>
        <nav>
            <a href="#" onclick="celebrate()">Hero</a>
            <a href="#" onclick="celebrate()">Mentor</a>
            <a href="#" onclick="celebrate()">Best Dad</a>
        </nav>
    </header>

    <div class="hero-container">
        <div class="text-side">
            <p class="intro">Happy Birthday!</p>
            <h1>Best Papa!</h1>
            <h2>Jerome Abillon</h2>
            
            <div class="cta-buttons">
                <button class="btn btn-filled" onclick="celebrate()">Celebrate Me</button>
                <button class="btn btn-outline" onclick="showLove()">Show Love ❤️</button>
            </div>

            <div class="cake-area">
                <div class="cake-label" id="instruction">🎂 Tap the cake to blow the candle!</div>
                <div class="cake" id="birthdayCake" onclick="blowCandle()">
                    <div class="candle">
                        <div class="flame" id="candleFlame"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="image-side">
            <div class="dad-photo-wrapper">
