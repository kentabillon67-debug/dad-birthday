<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Papa!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #1e3a8a, #3b82f6, #6d28d9, #7c3aed);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        @media (max-width: 768px) {
            .main-card {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 25px;
            }
            .image-side { order: -1; }
        }

        .intro {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #bae6fd;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #facc15;
            text-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .typewriter-box {
            height: 35px;
            margin-bottom: 30px;
        }

        .typewriter-text {
            font-size: 1.8rem;
            font-weight: 400;
            border-right: 3px solid white;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            display: inline-block;
            animation: typing 4s steps(14, end) infinite, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            40%, 80% { width: 14ch; }
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .cta-buttons { justify-content: center; }
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-filled {
            background-color: white;
            color: #2563eb;
        }

        .btn-filled:hover {
            background-color: transparent;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: #2563eb;
        }

        .dad-photo {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        /* --- Pop-up Overlay --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal:target {
            display: flex !important;
        }

        .dashboard-container {
            background: linear-gradient(135deg, #1e40af, #4f46e5);
            border-radius: 24px;
            padding: 45px 35px 35px 35px;
            max-width: 950px;
            width: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 35px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        @media (max-width: 800px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
                padding: 30px 20px;
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 2.2rem;
            cursor: pointer;
            text-decoration: none;
            z-index: 1010;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .nav-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 5px;
        }

        .member-link {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 20px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }

        .member-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .display-side {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .pane {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 20px;
        }

        .pane img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .msg-box {
            font-size: 1.1rem;
            line-height: 1.6;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #facc15;
            font-style: italic;
            max-height: 180px;
            overflow-y: auto;
        }

        /* --- Mechanical Confetti Engine --- */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
            display: none;
        }

        body:has(.btn-filled:active) .confetti-container,
        #msgDashboard:target .confetti-container {
            display: block !important;
        }

        .strip {
            position: absolute;
            width: 12px;
            height: 24px;
            top: -30px;
            border-radius: 3px;
            animation: drop linear infinite;
        }

        .s1 { left: 8%; background: #facc15; animation-duration: 2.5s; }
        .s2 { left: 22%; background: #3b82f6; animation-duration: 3.1s; animation-delay: 0.4s; }
        .s3 { left: 38%; background: #ffffff; animation-duration: 2.8s; animation-delay: 0.9s; }
        .s4 { left: 52%; background: #f472b6; animation-duration: 3.4s; animation-delay: 0.2s; }
        .s5 { left: 68%; background: #34d399; animation-duration: 2.7s; animation-delay: 0.6s; }
        .s6 { left: 82%; background: #ff4500; animation-duration: 3.2s; animation-delay: 1.1s; }
        .s7 { left: 94%; background: #a855f7; animation-duration: 2.9s; animation-delay: 0.5s; }

        @keyframes drop {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-side">
            <p class="intro">Happy Birthday!</p>
            <h1>Best Papa!</h1>
            <div class="typewriter-box">
                <span class="typewriter-text">Jerome Abillon</span>
            </div>
            
            <div class="cta-buttons">
                <button class="btn btn-filled">Celebrate Me</button>
                <a href="#msgDashboard" class="btn btn-outline">Messages ❤️</a>
            </div>
        </div>
        <div class="image-side">
            <img src="papa%202nd.jpg" class="dad-photo" alt="Papa">
        </div>
    </div>

    <!-- Messages Modal Popup Container -->
    <div class="modal" id="msgDashboard">
        
        <div class="confetti-container">
            <div class="strip s1"></div>
            <div class="strip s2"></div>
            <div class="strip s3"></div>
