<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dad! | DadFolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Navbar Layout */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        /* Hero Content Grid */
        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 40px 20px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 20px;
            }
            .image-side {
                order: -1;
            }
        }

        /* Text Side Styling */
        .text-side p.intro {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .text-side h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .text-side h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 35px;
            border-right: 3px solid white;
            white-space: nowrap;
            width: 0;
            overflow: hidden;
            animation: typing 3.5s steps(30, end) infinite, blink 0.75s step-end infinite;
        }

        @media (max-width: 768px) {
            .text-side h1 { font-size: 2.8rem; }
            .text-side h2 { font-size: 1.4rem; margin: 0 auto 35px auto; }
        }

        /* Typewriter Animations */
        @keyframes typing {
            0%, 100% { width: 0; }
            40%, 80% { width: 17ch; } /* Exact character length of 'Mentor & Legend ' */
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        /* Custom Action Buttons */
        .cta-buttons {
            display: flex;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .cta-buttons { justify-content: center; }
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: white;
        }

        .btn-filled {
            background-color: white;
            color: #be123c;
        }

        .btn-filled:hover {
            background-color: transparent;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: #be123c;
        }

        /* Image Side Styling */
        .image-side {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dad-photo-wrapper {
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            /* Creates a premium 3D lift effect under his cutout photo */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.35));
        }

        .dad-photo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Confetti Elements */
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 1;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }

        /* Background Spark Particles */
        .bg-spark {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatUp linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Subtle Ambient Sparks Floating in Background -->
    <script>
        for (let i = 0; i < 20; i++) {
            const spark = document.createElement('div');
            spark.classList.add('bg-spark');
            spark.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 5 + 3 + 'px';
            spark.style.width = size;
            spark.style.height = size;
            spark.style.animationDuration = Math.random() * 6 + 6 + 's';
            spark.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(spark);
        }
    </script>

    <header>
        <div class="logo">DadFolio</div>
        <nav>
            <a href="#" onclick="celebrate()">Hero</a>
            <a href="#" onclick="celebrate()">Mentor</a>
            <a href="#" onclick="celebrate()">Best Dad</a>
        </nav>
    </header>

    <div class="hero-container">
        <!-- Left Column: Content -->
        <div class="text-side">
            <p class="intro">Happy Birthday!</p>
            <h1>I'm Super Dad</h1>
            <h2>Mentor & Legend</h2>
            
            <div class="cta-buttons">
                <button class="btn btn-filled" onclick="celebrate()">Celebrate Me</button>
                <button class="btn btn-outline" onclick="showLove()">Show Love ❤️</button>
            </div>
        </div>

        <!-- Right Column: Image Location (Updated for 'papa main.png') -->
        <div class="image-side">
            <div class="dad-photo-wrapper">
                <img src="papa main.png" alt="My Father">
            </div>
        </div>
    </div>

    <script>
        function celebrate() {
            const colors = ['#ffffff', '#facc15', '#ffedd5', '#fecdd3', '#bae6fd'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 6 + 6 + 'px';
                confetti.style.height = Math.random() * 10 + 6 + 'px';
                
                const speed = Math.random() * 2 + 1.5; 
                confetti.style.animationDuration = speed + 's';
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), (speed + 0.3) * 1000);
            }
        }

        function showLove() {
            alert("❤️ You are the best father in the universe! Happy Birthday! 🎉");
            celebrate();
        }
    </script>
</body>
</html>
