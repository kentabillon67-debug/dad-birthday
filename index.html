<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dad!</title>
    <!-- Updated Stable FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --pink: #f43f5e;
            --yellow: #facc15;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .img-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 20px;
            background-color: #111827;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .profile-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-box h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--accent), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bounce-icon {
            font-size: 2rem;
            color: var(--yellow);
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item i {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        .stat-item h3 {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .stat-item span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 0 10px 10px 0;
        }

        .message-box p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .btn-greet {
            background: linear-gradient(135deg, var(--accent), #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-greet:hover {
            opacity: 0.9;
        }

        .btn-greet:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Left Column: Photo & Name -->
        <div class="card profile-card">
            <div class="img-container">
                <!-- Points directly to your uploaded dad.jpg file -->
                <img src="dad.jpg" alt="My Father" onerror="this.src='https://unsplash.com'">
            </div>
            <h2>Super Dad</h2>
            <p>Hero & Mentor</p>
        </div>

        <!-- Right Column: Dashboard & Greetings -->
        <div class="main-content">
            <div class="card">
                <div class="header-box">
                    <h1>Happy Birthday, Dad!</h1>
                    <i class="fa-solid fa-cake-candles bounce-icon"></i>
                </div>
                <div class="message-box" style="margin-top: 15px;">
                    <p>Thank you for your endless guidance, strength, and love. Wishing you a day filled with joy, great health, and happiness!</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fa-solid fa-heart"></i>
                    <h3>100%</h3>
                    <span>Love</span>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h3>Infinite</h3>
                    <span>Support</span>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-trophy"></i>
                    <h3>#1</h3>
                    <span>Father</span>
                </div>
            </div>

            <button class="btn-greet" onclick="celebrate()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Click for a Surprise
            </button>
        </div>
    </div>

    <script>
        function celebrate() {
            alert("🎉 Happy Birthday to the best Dad in the world! We love you! 🎂");
        }
    </script>
</body>
</html>
