<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Papa! | Papaw's Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #1e3a8a, #3b82f6, #6d28d9, #7c3aed);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 20px;
            }
            .image-side {
                order: -1;
            }
        }

        .text-side p.intro {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .text-side h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 5px;
            line-height: 1.1;
            color: #facc15 !important; 
            text-shadow: 0 4px 20px rgba(250, 204, 21, 0.6) !important;
        }

        .text-side h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 35px;
            border-right: 3px solid white;
            white-space: nowrap;
            width: 0;
            overflow: hidden;
            animation: typing 4s steps(14, end) infinite, blink 0.75s step-end infinite;
        }

        @media (max-width: 900px) {
            .text-side h1 { font-size: 2.8rem; }
            .text-side h2 { font-size: 1.4rem; margin: 0 auto 35px auto; }
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            40%, 80% { width: 14ch; }
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: white; }
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
        }

        @media (max-width: 900px) {
            .cta-buttons { justify-content: center; }
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-filled {
            background-color: white;
            color: #2563eb;
        }

        .btn-filled:hover {
            background-color: transparent;
            color: white;
        }

        .btn-outline:hover {
            background-color: white;
            color: #2563eb;
        }

        .image-side {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .dad-photo-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .dad-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- Custom Interactive Modal Layer (Messages View Dashboard) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .dashboard-container {
            background: linear-gradient(135deg, #1e40af, #4f46e5);
            width: 100%;
            max-width: 1100px;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: center;
        }

        @media (max-width: 850px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                padding: 25px;
                gap: 25px;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        .close-dashboard {
            position: absolute;
            top: 20px;
            right: 25px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-dashboard:hover {
            color: white;
        }

        .dashboard-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dashboard-title {
            font-size: 2rem;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 10px;
        }

        .member-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .member-btn:hover, .member-btn.active {
            background: #facc15;
            color: #1e3a8a;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        .dashboard-right {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .display-default-view {
            text-align: center;
            max-width: 400px;
        }

        .default-family-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .letter-view-pane {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            gap: 20px;
        }

        .letter-view-pane.active {
            display: flex;
        }

        .letter-img-wrapper {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .letter-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .letter-text-box {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            max-height: 220px;
            overflow-y: auto;
            border-left: 4px solid #facc15;
            font-style: italic;
        }

        /* --- Background Animation Elements --- */
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 100;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }

        .bg-spark {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatUp linear infinite;
            z-index: 2;
            pointer-events: none;
        }
